appId: org.openai.sparkwovenperson
productName: The Spark and the Woven Person
directories:
  output: release
files:
  - dist/**/*
  - electron/main.cjs
  - package.json
asar: true
extraMetadata:
  main: electron/main.cjs
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: The Spark and the Woven Person
